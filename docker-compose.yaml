services:
  db_app2:
    image: postgres:16
    container_name: db-pokedex
    environment:
      POSTGRES_USER: ${POKEDEX_USER}
      POSTGRES_PASSWORD: ${POKEDEX_PASSWORD}
      POSTGRES_DB: ${POKEDEX_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_pokedex:/var/lib/postgresql/data

  mongodb:
    image: mongo:8.0
    container_name: pokedex-mongodb
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodata_pokedex:/data/db

volumes:
  pgdata_pokedex:
  mongodata_pokedex: